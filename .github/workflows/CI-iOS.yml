name: CI-iOS

# Runs on every push.
on: push

jobs:
  build-and-test:
    # A standard runner. `macos-14-xlarge` is a paid larger runner, which the repository's free
    # minutes do not cover, and every job on it was refused on billing before it started.
    runs-on: macos-26

    # The app and seven frameworks build from cold, Firebase included, on every run.
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v5

    # The app and every framework target iOS 26, and the framework projects are
    # `objectVersion = 77`, so it has to be an Xcode 26. Newest installed, not a pinned path,
    # so a runner image update does not break the job.
    - name: Select Xcode
      run: sudo xcode-select -switch "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

    - name: Xcode version
      run: /usr/bin/xcodebuild -version

    - name: Build and Test
      run: >-
        xcodebuild test
        -workspace InTheGym.xcworkspace
        -scheme "CI_iOS"
        -sdk iphonesimulator
        -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=latest"
        -skipPackagePluginValidation
        -skipMacroValidation
        CODE_SIGN_IDENTITY=""
        CODE_SIGNING_REQUIRED=NO
        ONLY_ACTIVE_ARCH=YES
